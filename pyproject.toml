[project]
name = "adaptive-lidar-mapping"
version = "0.1.0"
description = "Adaptive Variable-Resolution 2.5D LiDAR Mapping System — SIH 2026, Problem 26053 (DRDO)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
train = ["torch>=2.0"]
dev = ["pytest>=7.4"]
[tool.pytest.ini_options]
testpaths = ["tests"]